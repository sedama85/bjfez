="min-width:190px">'+text+'</div>');info.setPosition(pts[pts.length-1]);info.open(map);}mode='';pts=[];map.setCursor('');}naver.maps.Event.addListener(map,'click',function(e){if(mode){pts.push(e.coord);redraw();}});naver.maps.Event.addListener(map,'mousemove',function(e){if(mode&&pts.length)redraw(e.coord);});naver.maps.Event.addListener(map,'dblclick',function(){if(mode)setTimeout(finish,0);});document.getElementById('vDist').onclick=function(){start('d');};document.getElementById('vArea').onclick=function(){start('a');};document.getElementById('vClear').onclick=function(){items.forEach(function(o){o.setMap(null);});items=[];if(preview)preview.setMap(null);preview=null;mode='';pts=[];map.setCursor('');};})();
})();</script></body></html>
