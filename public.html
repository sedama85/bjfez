  (function measurement(){var mode='',pts=[],preview=null,items=[],NF1=new Intl.NumberFormat('ko-KR',{minimumFractionDigits:1,maximumFractionDigits:1}),NF2=new Intl.NumberFormat('ko-KR',{minimumFractionDigits:2,maximumFractionDigits:2}),NF4=new Intl.NumberFormat('ko-KR',{minimumFractionDigits:4,maximumFractionDigits:4});function dist(a,b){var R=6371008.8,p1=lat(a)*Math.PI/180,p2=lat(b)*Math.PI/180,dp=p2-p1,dl=(lng(b)-lng(a))*Math.PI/180,x=Math.sin(dp/2),y=Math.sin(dl/2);return 2*R*Math.asin(Math.sqrt(x*x+Math.cos(p1)*Math.cos(p2)*y*y));}function area(ps){var R=6378137,sum=0;for(var i=0;i<ps.length;i++){var a=ps[i],b=ps[(i+1)%ps.length];sum+=(lng(b)-lng(a))*Math.PI/180*(2+Math.sin(lat(a)*Math.PI/180)+Math.sin(lat(b)*Math.PI/180));}return Math.abs(sum*R*R/2);}function redraw(cursor){if(preview)preview.setMap(null);var q=pts.slice();if(cursor)q.push(cursor);if(!q.length)return;preview=mode==='d'?new naver.maps.Polyline({map:map,path:q,strokeColor:'#ef4444',strokeWeight:4,strokeStyle:'shortdash',clickable:false,zIndex:900000}):new naver.maps.Polygon({map:map,paths:[q],strokeColor:'#f59e0b',strokeWeight:4,fillColor:'#f59e0b',fillOpacity:.15,clickable:false,zIndex:900000});}function start(m){mode=m;pts=[];map.setCursor('crosshair');redraw();}function finish(){if(!mode)return;if(preview){preview.setMap(null);preview=null;}var text='',o;if(mode==='d'&&pts.length>=2){var d=0;for(var i=1;i<pts.length;i++)d+=dist(pts[i-1],pts[i]);o=new naver.maps.Polyline({map:map,path:pts,strokeColor:'#ef4444',strokeWeight:4,strokeStyle:'shortdash',zIndex:900000});text='<b>총거리</b> '+(d>=1000?NF2.format(d/1000)+' km':NF1.format(d)+' m');}if(mode==='a'&&pts.length>=3){var a=area(pts);o=new naver.maps.Polygon({map:map,paths:[pts],strokeColor:'#f59e0b',strokeWeight:4,fillColor:'#f59e0b',fillOpacity:.15,zIndex:900000});text='<b>면적</b> '+Math.round(a).toLocaleString()+' m² / '+NF4.format(a/10000)+' ha / '+NF1.format(a/3.3058)+' 평';}if(o){items.push(o);info.setContent('<div class="popup-inner" style="min-width:190px">'+text+'</div>');info.setPosition(pts[pts.length-1]);info.open(map);}mode='';pts=[];map.setCursor('');}naver.maps.Event.addListener(map,'click',function(e){if(mode){pts.push(e.coord);redraw();}});naver.maps.Event.addListener(map,'mousemove',function(e){if(mode&&pts.length)redraw(e.coord);});naver.maps.Event.addListener(map,'dblclick',function(){if(mode)setTimeout(finish,0);});document.getElementById('vDist').onclick=function(){start('d');};document.getElementById('vArea').onclick=function(){start('a');};document.getElementById('vClear').onclick=function(){items.forEach(function(o){o.setMap(null);});items=[];if(preview)preview.setMap(null);preview=null;mode='';pts=[];map.setCursor('');};})();
